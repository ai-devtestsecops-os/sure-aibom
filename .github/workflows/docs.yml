# main 에 푸시될 때마다 문서 사이트를 빌드해 gh-pages 브랜치에 올린다 (GitHub Pages 가 그 브랜치를 보여 준다).
# Material for MkDocs 공식 안내의 워크플로를 그대로 따르고, 설치 버전만 고정했다.
name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      # 로컬에서 쓰는 버전으로 고정해, 버전이 바뀌어 화면이 달라지지 않게 한다
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==12.1
      - run: mkdocs gh-deploy --force
