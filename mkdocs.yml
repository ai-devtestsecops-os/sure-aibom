site_name: aibom-cli
site_description: AI-BOM 생성 CLI 문서
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: ko
  favicon: "data:,"          # 브라우저 탭 아이콘 없음 (기본 로고 대신 브라우저 기본 아이콘)
  palette:                        # 상단 바 메뉴: 라이트 · 다크 · 시스템 (overrides/partials/palette.html). 시스템이 첫 항목이라 기본값
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/circle-half-full
        name: System
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/white-balance-sunny
        name: Light
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.indexes      # 섹션 제목이 곧 그 섹션의 첫 페이지
    - navigation.path         # 제목 위 경로 (aibom-cli / 가이드 / 스캔 대상)
    - navigation.footer
    - search.highlight
    - content.code.copy
extra:
  generator: false
extra_css:
  - stylesheets/extra.css
  - mapping-viewer/viewer.css
extra_javascript:
  - javascripts/palette-menu.js
  - mapping-viewer/app.js
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - 홈: index.md
  - 작동 방식: about.md
  - 가이드:
      - guides/index.md                           # 섹션 이름을 누르면 이 페이지, 화살표로 펼침
      - 시작하기: guides/getting-started.md
      - 스캔 대상: guides/scan-targets.md
      - 수집 항목: guides/collected-items.md
      - 출력 포맷: guides/output-format.md
  - 규제 준수:
      - compliance/index.md
      - AI-BOM v0.6 필드: compliance/aibom-v0.6.md
      - properties 키: compliance/regulation-fields.md
      - 필드 탐색기: compliance/field-mapping.md
