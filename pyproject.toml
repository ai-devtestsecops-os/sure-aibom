[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sure-aibom"
version = "0.2.0"
description = "SURE AI-BOM Generator: Compliance-Aware AI-BOM Generation Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.20", "referencing>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sure-aibom = "sure_aibom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sure_aibom = ["engine/common/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
