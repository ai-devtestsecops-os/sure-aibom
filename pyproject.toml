[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sure-aibom"
version = "0.2.0"
description = "SURE AI-BOM Generator: Compliance-Aware AI-BOM Generation Tool"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.20", "referencing>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ai-devtestsecops-os/sure-aibom"
Documentation = "https://ai-devtestsecops-os.github.io/sure-aibom/"
Repository = "https://github.com/ai-devtestsecops-os/sure-aibom"
Issues = "https://github.com/ai-devtestsecops-os/sure-aibom/issues"

[project.scripts]
sure-aibom = "sure_aibom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sure_aibom = ["engine/common/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
